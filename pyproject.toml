[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texturelab-engine"
version = "2.3.0"
description = "Core engine for pavement texture evaluation"
authors = [{name = "TextureLab"}]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "numba>=0.58"
]

[tool.setuptools.packages.find]
include = ["engine*"]
