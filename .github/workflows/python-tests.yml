name: Python Tests

on:
  push:
    branches: [ "master", "beta" ]
  pull_request:
    branches: [ "master", "beta" ]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e .
        if [ -f TextureLab/requirements.txt ]; then pip install -r TextureLab/requirements.txt; fi
        
    - name: Run tests
      run: |
        pytest > pytest_out.txt || echo "Tests finished"
